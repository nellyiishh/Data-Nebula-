# Builds web/ and publishes it to GitHub Pages (Settings → Pages → Source: GitHub Actions).
# Site data comes from the Cloud Run API (VITE_API_URL below); the committed data/web/ is
# still copied into dist/data as the static fallback.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one but never cancels a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      # Project pages live under /<repo>/, so assets and /data must use that base path.
      # VITE_API_URL: the site reads everything from the Cloud Run API (backend/Dockerfile).
      # Empty it to fall back to the static files from data/web/, which are still bundled.
      - run: npm run build -- --base=${{ steps.pages.outputs.base_path }}/
        env:
          VITE_API_URL: https://data-nebula-api-768205188377.europe-west1.run.app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
