[project]
name = "data-nebula-backend"
version = "0.1.0"
description = "Read-only API and offline NISAR pipeline for Data Nebula (NASA Space Apps 2026)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "numpy>=2.0",
    "pillow>=10.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1.380",
]
# Only needed to process real NISAR granules; the API runs without it.
pipeline = [
    "earthaccess>=0.19.0",
    "h5py>=3.11",
    "rasterio>=1.4",
    "scipy>=1.14",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app", "pipeline"]
addopts = "-q"
markers = ["slow: needs a long setup; skipped by the fast lane"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["app", "pipeline", "conftest.py", "testsupport.py"]
